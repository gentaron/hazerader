name: Daily AQI forecast

on:
  schedule:
    - cron: "17 22 * * *"   # 06:17 Malaysia time, after the 12 UTC CAMS/NWP runs are published
  workflow_dispatch:
    inputs:
      force:
        description: "Re-issue today's forecast even if it already exists"
        type: boolean
        default: false

# The workflow commits the new forecast to the repository; Netlify redeploys on that push.
permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run forecast pipeline
        working-directory: pipeline
        run: node src/run.mjs
        env:
          HZ_FORCE: ${{ inputs.force && '1' || '' }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          HZ_LAT: ${{ vars.HZ_LAT }}
          HZ_LON: ${{ vars.HZ_LON }}
      - name: Commit forecast and learning state
        run: |
          git config user.name "hazerader-bot"
          git config user.email "hazerader-bot@users.noreply.github.com"
          git add site/data/forecast.json data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "forecast: $(date -u +%Y-%m-%d)"
          git push

